name: Refresh Listener (Nostr)

# "The relay is the webhook."
# The site's 🔄 button publishes a tiny Nostr note tagged #toronto-skate-refresh
# from a throwaway key. This workflow polls the relays every ~30 min; if it sees
# a request newer than the data (and the data is older than MIN_AGE_HOURS), it
# refetches from the City API and commits — GitHub Pages redeploys automatically.
#
# It ALSO refreshes the toronto.ca skate service alerts on every tick
# (toronto.ca sends no CORS headers, so the browser can't fetch them live;
# this snapshot keeps alerts.json ≤ ~30-60 min stale). The alerts script
# only rewrites the file when alert content actually changed, so quiet
# ticks produce no commit.
#
# No secrets, no backend, no tokens exposed in the static page.
# Spam-proof: the event only *triggers* a refetch of official city data,
# and MIN_AGE_HOURS puts a hard floor on how often that can happen.

on:
  schedule:
    - cron: '*/30 * * * *'   # GitHub can delay these to ~45-60 min at busy times; that's fine
  workflow_dispatch:

concurrency:
  group: skate-data           # shares a lock with the weekly update — no races
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # gives us a built-in WebSocket client — zero npm deps

      - name: Check relays for refresh requests
        id: check
        env:
          MIN_AGE_HOURS: '12'  # server-side floor: never refetch if data is younger than this
        run: node scripts/check-refresh-request.js

      - name: Fetch skating data
        if: steps.check.outputs.refresh == 'true'
        run: node fetch-skate-data.js

      - name: Refresh service alerts (every tick, cheap)
        # Full fetch above already includes alerts; only run the light
        # alerts-only pass when we didn't do a full refresh.
        if: steps.check.outputs.refresh != 'true'
        run: node fetch-skate-data.js --alerts-only

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skate/projects/data/*.json
          git diff --staged --quiet || git commit -m "🛼 Update skating data (refresh/alerts via listener)"
          git pull --rebase origin main
          git push
