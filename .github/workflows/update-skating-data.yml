name: Update Skating Data

# NOTE: this file must live at .github/workflows/ (repo root, WITH the .github parent).
# GitHub silently ignores workflows anywhere else — including a root folder named just "workflows/".

on:
  schedule:
    - cron: '0 14 * * 0'   # Sunday 9 AM Toronto (14:00 UTC) — GitHub may delay cron by a few minutes
    # The City refreshes its open-data export weekly, mid-week (observed
    # Thursday ~21:40 UTC). A second pull Friday morning picks that up
    # within hours instead of waiting for Sunday.
    - cron: '0 10 * * 5'   # Friday 6 AM Toronto (10:00 UTC)
  workflow_dispatch:        # adds a manual "Run workflow" button in the Actions tab

concurrency:
  group: skate-data         # never let two data updates race each other
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # pdftotext (poppler) reads the two PDF-only cities (Whitchurch-Stouffville, Ajax);
      # without it those sources fail cleanly and keep their previous rows.
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils >/dev/null

      - name: Fetch skating data
        run: node fetch-skate-data.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skate/projects/data/*.json
          git diff --staged --quiet || git commit -m "🛼 Update skating data"
          git pull --rebase origin main
          git push
